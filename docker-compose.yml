services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel
    ports: ["127.0.0.1:5433:5432"] # this machine only: the database is never reachable from the network
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
